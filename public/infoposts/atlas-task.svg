<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AtlasTask visual second brain</title>
  <desc id="desc">A calm constellation of daily actions connected to a larger life map.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#2d6659"/><stop offset=".58" stop-color="#153b34"/><stop offset="1" stop-color="#071b18"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b6"/><stop offset="1" stop-color="#c99b44"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="900" rx="64" fill="url(#bg)"/>
  <g fill="none" stroke="#d8c785" stroke-opacity=".18" stroke-width="3">
    <path d="M600 450L292 235M600 450L910 220M600 450L240 620M600 450L940 650M600 450L565 130M600 450L620 760"/>
    <circle cx="600" cy="450" r="315"/><circle cx="600" cy="450" r="225" stroke-opacity=".12"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="292" cy="235" r="72" fill="#1a4c45" stroke="#58c9b2" stroke-width="4"/>
    <circle cx="910" cy="220" r="88" fill="#513244" stroke="#ef6f81" stroke-width="4"/>
    <circle cx="240" cy="620" r="62" fill="#3e304f" stroke="#b290d0" stroke-width="4"/>
    <circle cx="940" cy="650" r="76" fill="#594720" stroke="#ddb252" stroke-width="4"/>
    <circle cx="565" cy="130" r="54" fill="#23475a" stroke="#69bad4" stroke-width="4"/>
    <circle cx="620" cy="760" r="58" fill="#493c2d" stroke="#d7ae79" stroke-width="4"/>
  </g>
  <circle cx="600" cy="450" r="142" fill="#0a2621" stroke="url(#gold)" stroke-width="5" filter="url(#glow)"/>
  <path d="M540 450l37 38 82-91" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f8efd5" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="530" font-family="Georgia, serif" font-size="36">AtlasTask</text>
    <text x="292" y="240" font-size="18" font-weight="700">TODAY</text><text x="910" y="225" font-size="18" font-weight="700">PRIORITIES</text>
    <text x="240" y="625" font-size="17" font-weight="700">QUESTS</text><text x="940" y="655" font-size="17" font-weight="700">RHYTHMS</text>
    <text x="565" y="135" font-size="15" font-weight="700">NOTES</text><text x="620" y="765" font-size="15" font-weight="700">LIFE MAP</text>
  </g>
</svg>
